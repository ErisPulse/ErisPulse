repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [check, --fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (type check)
        entry: uv run basedpyright
        args: [src/ErisPulse]
        language: system
        types: [python]
        pass_filenames: false

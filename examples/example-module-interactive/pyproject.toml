[project]
name = "ErisPulse-InteractModule"
version = "1.0.0"
description = "交互进阶示例模块：消息事务与回执、ORM 进阶声明、请求审批与发送链修饰"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "yourname", email = "your@mail.com" } ]

dependencies = [
]

[project.urls]
"homepage" = "https://github.com/yourname/InteractModule"

[project.entry-points]
"erispulse.module" = { "InteractModule" = "InteractModule:Main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["InteractModule"]

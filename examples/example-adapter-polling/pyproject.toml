[project]
name = "ErisPulse-ExamplePollingAdapter"
version = "1.0.0"
description = "ErisPulse HTTP 轮询模式适配器示例（PollingAdapter / getUpdates 型平台）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "yourname", email = "your@mail.com" } ]

dependencies = [
    "ErisPulse>=2.11",
]

[project.urls]
"homepage" = "https://github.com/yourname/ExamplePollingAdapter"

[project.entry-points]
"erispulse.adapter" = { "example_polling" = "ExamplePollingAdapter:ExamplePollingAdapter" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ExamplePollingAdapter"]

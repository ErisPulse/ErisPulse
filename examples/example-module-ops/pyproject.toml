[project]
name = "ErisPulse-OpsModule"
version = "1.0.0"
description = "运维治理示例模块：线程任务归属、延迟任务、内存体检与运行时日志隐私开关"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "yourname", email = "your@mail.com" } ]

dependencies = [
]

[project.urls]
"homepage" = "https://github.com/yourname/OpsModule"

[project.entry-points]
"erispulse.module" = { "OpsModule" = "OpsModule:Main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["OpsModule"]

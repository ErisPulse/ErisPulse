[project]
name = "ErisPulse-ExampleWebhookAdapter"
version = "1.0.0"
description = "ErisPulse HTTP 回调模式适配器示例（WebhookAdapter / 平台推送回调型）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "yourname", email = "your@mail.com" } ]

dependencies = [
    "ErisPulse>=2.11",
]

[project.urls]
"homepage" = "https://github.com/yourname/ExampleWebhookAdapter"

[project.entry-points]
"erispulse.adapter" = { "example_webhook" = "ExampleWebhookAdapter:ExampleWebhookAdapter" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ExampleWebhookAdapter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ErisPulse"
version = "2.5.3"
description = "ErisPulse 是一个模块化、可扩展的异步 Python SDK 框架，主要用于构建高效、可维护的机器人应用程序。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "ErisDev" }
]

maintainers = [
    { name = "艾莉丝·格雷拉特(WSu2059)", email = "wsu2059@qq.com" }
]

keywords = [
    "async",
    "bot",
    "sdk",
    "framework",
    "robot",
    "chatbot",
    "bot-framework",
    "onebot",
    "onebot12",
    "telegram",
    "qq",
    "multi-platform",
    "extensible",
    "modular",
    "asyncio",
    "instant-messaging",
    "kook",
    "yunhu",
    "matrix",
    "email",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed"
]

dependencies = [
    "rich>=13.0.0",
    "toml>=0.10.2",

    # network 相关
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/ErisPulse/ErisPulse"
Documentation = "https://www.erisdev.com#docs"
Repository = "https://github.com/ErisPulse/ErisPulse"
Issues = "https://github.com/ErisPulse/ErisPulse/issues"
"Bug Tracker" = "https://github.com/ErisPulse/ErisPulse/blob/main/docs/en/bug-tracker.md"
Changelog = "https://github.com/ErisPulse/ErisPulse/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.24.0",
]
dev = [
    "pyclean>=3.6.0",
    "ruff>=0.1.7",
]

[project.scripts]
ep-init = "ErisPulse.__init__:init_sync"
epsdk = "ErisPulse.__main__:main"
ep = "ErisPulse.__main__:main"
ep-cli = "ErisPulse.__main__:main"
epsdk-cli = "ErisPulse.__main__:main"

[tool.hatch]
project.root = "src"

[tool.hatch.build.targets.wheel]
packages = ["src/ErisPulse"]

[tool.hatch.build.targets.wheel.force-include]
"src/ErisPulse/py.typed" = "ErisPulse/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ErisPulse",
]

[tool.ruff]
target-version = "py310"

include = ["src/**/*.py"]

extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "build",
    "dist"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
minversion = "7.0"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--showlocals",
    "--cov=src/ErisPulse",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--asyncio-mode=auto",
    "--ignore=tests/devs",
    "--ignore=tests/performance",
    "--ignore=tests/stress",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "performance: 性能测试",
    "stress: 压力测试",
    "slow: 慢速测试",
    "adapter: 适配器相关测试",
    "module: 模块相关测试",
    "event: 事件系统相关测试",
    "lifecycle: 生命周期相关测试",
    "config: 配置管理相关测试",
    "storage: 存储管理相关测试",
    "logger: 日志管理相关测试",
    "router: 路由管理相关测试",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    # starlette.testclient 依赖旧版 httpx，升级前忽略兼容性警告
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # sqlite3 WAL 模式在 GC 阶段的已知假阳性
    "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
source = ["src/ErisPulse"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "*/test_*.py",
    "*/loaders/base_loader.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@typing.overload",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

name: 🎀 Eris PyPI Publish

on:
  workflow_dispatch: {}
  push:
    # tag 触发发布：auto-tag-release 以 GitHub App Token 推送 v* tag（App Token
    # 产生的事件可触发后续 workflow，与 GITHUB_TOKEN 不同），维护者手动推 v* tag
    # 同样触发；与 docker-publish.yml 的 tag 触发模式保持一致
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 发布前置一致性校验：pyproject version == CHANGELOG 最新条目；
      # tag 触发时额外校验 tag 名与版本一致（workflow_dispatch 场景 ref 不是
      # tag，无法校验，仅跑基础一致性检查）
      - name: Release consistency check
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python -m scripts.tools check release-check --tag "${GITHUB_REF#refs/tags/}"
          else
            python -m scripts.tools check release-check
          fi

      - name: Setup environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # - name: Generate type stubs
      #   run: |
      #     python -m scripts.tools gen type-stubs --src src --output src --clean --force
      #     echo "Type stubs generation complete"
      # 存根生成器存在一些缺陷，暂时停止使用
      # 详见 CONTRIBUTING.md -> 注解存根生成

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/erispulse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrieve artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true


name: 🎀 Eris PyPI Publish

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 发布前置一致性校验：pyproject version == CHANGELOG 最新条目
      # （旧 Version check 步骤读取 refs/tags/，但本 workflow 仅 workflow_dispatch
      # 触发、该变量永不含 tag，属死代码，已删除）
      - name: Release consistency check
        run: python scripts/tools/release_check.py

      - name: Setup environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # - name: Generate type stubs
      #   run: |
      #     python scripts/tools/generate-type-stubs.py --src src --output src --clean --force
      #     echo "Type stubs generation complete"
      # 存根生成器存在一些缺陷，暂时停止使用
      # 详见 CONTRIBUTING.md -> 注解存根生成

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/erispulse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Retrieve artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true


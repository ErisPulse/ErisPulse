name: 🎀 Eris Version Management

permissions:
  contents: write

# 连续 push 时不取消进行中的发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main, Pre-Release/v2]

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Release consistency check
        run: python -m scripts.tools check release-check

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create tag and release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          # Read current version
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          tag_name="v$version"

          echo "Current version: $version"
          echo "Tag name: $tag_name"

          # Extract changelog from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Fix version format: replace -de. with -dev.
            fixed_version=$(echo "$version" | sed 's/-de\./-dev./g')

            echo "Trying to match version: $version or $fixed_version"

            # Use sed to extract version changelog
            # First try matching the original version number
            changelog_section=$(sed -n "/^## \[$version\] -/,/^## \[.*\] -/p" CHANGELOG.md | sed '$d')

            # If not found, try matching the fixed version number
            if [ -z "$changelog_section" ]; then
              changelog_section=$(sed -n "/^## \[$fixed_version\] -/,/^## \[.*\] -/p" CHANGELOG.md | sed '$d')
            fi

            # Remove the first line (title line)
            if [ -n "$changelog_section" ]; then
              changelog=$(echo "$changelog_section" | tail -n +2)

              # Determine if this is a dev version
              # 预发布判定：dev/alpha/beta/rc/pre；旧正则 dev|alpha|beta|pre|a|b
              # 中的裸 a|b 会把任何含字母 a/b 的版本误判，且漏掉 rc
              # （rc.1 不含 a/b 字母 → 被当成正式版打 --latest），与
              # docker-publish.yml 及 release_check.py 的 rc 处理不一致
              if echo "$version" | grep -qE '(dev|alpha|beta|rc|pre)'; then
                is_dev="true"
                latest_flag=""
              else
                is_dev="false"
                latest_flag="--latest"
              fi

              # Check if tag already exists
              if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
                echo "Creating new tag $tag_name"
                git tag "$tag_name"
                git push origin "$tag_name"
              else
                echo "Tag $tag_name already exists"
                echo "tag_preexisted=true" >> $GITHUB_OUTPUT
              fi

              # Check if release exists
              if gh release view "$tag_name" &>/dev/null; then
                # Update release
                echo "Updating release $tag_name"
                gh release edit "$tag_name" \
                  --notes "$changelog" \
                  --prerelease=$is_dev
                echo "Release updated $tag_name"
                echo "release_updated=true" >> $GITHUB_OUTPUT
              else
                # Create release
                echo "Creating release $tag_name"
                gh release create "$tag_name" \
                  --notes "$changelog" \
                  --title "ErisPulse $tag_name" \
                  --prerelease=$is_dev \
                  $latest_flag
                echo "Release created $tag_name"
                echo "release_created=true" >> $GITHUB_OUTPUT
              fi

              echo "Release page: https://github.com/${{ github.repository }}/releases/tag/$tag_name"
            else
              echo "No changelog found for version $version"
            fi
          else
            echo "CHANGELOG.md file does not exist"
          fi

      - name: Trigger website docs rebuild
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # ErisPulse 发版后触发官网仓库的文档静态化重建（build-docs.yml）
          gh api repos/ErisPulse/erispulse.github.io/dispatches \
            -f event_type=docs-build \
            --jq '.event_type // "dispatched"' || true

      - name: Trigger App rootfs sync
        # 仅新版本（tag 新建或 release 新建）通知：普通 push 的 release notes
        # 更新不触发 rootfs 重建
        if: steps.create-release.outputs.release_created == 'true' || (steps.create-release.outputs.release_updated == 'true' && steps.create-release.outputs.tag_preexisted != 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 发版后通知 App 仓库重建 rootfs 资产（rootfs-sync.yml）。dev/预发布
          # 不通知：rootfs 是固定名滚动资产，只跟随正式版。dispatch 失败不阻塞
          # 本次发布，可手动在 App 仓库跑 Rootfs Sync 重试。
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          if echo "$version" | grep -qE '(dev|alpha|beta|rc|pre)'; then
            echo "prerelease $version — skip rootfs sync"
            exit 0
          fi
          gh api repos/ErisPulse/ErisPulse-App/dispatches \
            -f event_type=framework-released \
            -F "client_payload[version]=$version" \
            --jq '.event_type // "dispatched"' \
            || echo "App 仓库 dispatch 失败（不影响本次发布）"

      # 发行版不再附带任何构建附件：AI 物料（prompts .md）与技能包（skills .zip）
      # 由 auto-update-docs 生成并提交回开发分支，官网直接链接分支文件下载；
      # 客户端可执行包由 ErisPulse-App 自构建发布（rootfs 资产跟随其 latest
      # release 滚动更新，见上方 Trigger App rootfs sync）。


name: 🎀 Eris Version Management

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, Pre-Release/v2]

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create tag and release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          # Read current version
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          tag_name="v$version"

          echo "Current version: $version"
          echo "Tag name: $tag_name"

          # Extract changelog from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Fix version format: replace -de. with -dev.
            fixed_version=$(echo "$version" | sed 's/-de\./-dev./g')

            echo "Trying to match version: $version or $fixed_version"

            # Use sed to extract version changelog
            # First try matching the original version number
            changelog_section=$(sed -n "/^## \[$version\] -/,/^## \[.*\] -/p" CHANGELOG.md | sed '$d')

            # If not found, try matching the fixed version number
            if [ -z "$changelog_section" ]; then
              changelog_section=$(sed -n "/^## \[$fixed_version\] -/,/^## \[.*\] -/p" CHANGELOG.md | sed '$d')
            fi

            # Remove the first line (title line)
            if [ -n "$changelog_section" ]; then
              changelog=$(echo "$changelog_section" | tail -n +2)

              # Determine if this is a dev version
              if [[ $version =~ dev|alpha|beta|pre|a|b ]]; then
                is_dev="true"
                latest_flag=""
              else
                is_dev="false"
                latest_flag="--latest"
              fi

              # Check if tag already exists
              if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
                echo "Creating new tag $tag_name"
                git tag "$tag_name"
                git push origin "$tag_name"
              else
                echo "Tag $tag_name already exists"
              fi

              # Check if release exists
              if gh release view "$tag_name" &>/dev/null; then
                # Update release
                echo "Updating release $tag_name"
                gh release edit "$tag_name" \
                  --notes "$changelog" \
                  --prerelease=$is_dev
                echo "Release updated $tag_name"
                echo "release_updated=true" >> $GITHUB_OUTPUT
              else
                # Create release
                echo "Creating release $tag_name"
                gh release create "$tag_name" \
                  --notes "$changelog" \
                  --title "ErisPulse $tag_name" \
                  --prerelease=$is_dev \
                  $latest_flag
                echo "Release created $tag_name"
                echo "release_created=true" >> $GITHUB_OUTPUT
              fi

              echo "Release page: https://github.com/${{ github.repository }}/releases/tag/$tag_name"
            else
              echo "No changelog found for version $version"
            fi
          else
            echo "CHANGELOG.md file does not exist"
          fi

      - name: Generate AI material documents
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        run: |
          # Dynamically create output directories for all languages
          for lang_dir in docs/*/; do
            lang=$(basename "$lang_dir")
            if [ "$lang" != "_meta" ]; then
              mkdir -p "docs/$lang/ai-support/prompts"
            fi
          done

          if [ -f "scripts/tools/generate-ai-prompts.py" ]; then
            python scripts/tools/generate-ai-prompts.py
            echo "AI material documents generated"
          else
            echo "AI Prompt generation script not found, skipping this step"
          fi

      - name: Collect AI material documents
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        run: |
          mkdir -p release_assets

          # Dynamically scan all language directories
          PROMPT_FILES="ErisPulse-ModuleDev.md ErisPulse-AdapterDev.md ErisPulse-Full.md"
          for lang_dir in docs/*/; do
            lang=$(basename "$lang_dir")
            [ "$lang" = "_meta" ] && continue
            prompts_dir="docs/$lang/ai-support/prompts"
            [ -d "$prompts_dir" ] || continue
            for prompt_file in $PROMPT_FILES; do
              if [ -f "$prompts_dir/$prompt_file" ]; then
                base="${prompt_file%.md}"
                cp "$prompts_dir/$prompt_file" "release_assets/${base}-${lang}.md"
              fi
            done
          done

          echo "AI docs collected:"
          ls -la release_assets/ || true

      - name: Build standalone executables (pybuild)
        id: pybuild
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        continue-on-error: true
        shell: bash
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')

          # --- 1. Build ErisPulse wheel ---
          python -m pip install --upgrade pip build
          python -m build --wheel
          WHEEL=$(ls dist/erispulse-*.whl | head -1)
          echo "Built wheel: $WHEEL"

          # --- 2. Download pybuild ---
          PYBUILD_VERSION="v1"
          curl -fSL "https://github.com/pybuild-org/pybuild/releases/download/${PYBUILD_VERSION}/pybuild_linux_amd64" -o pybuild
          chmod +x pybuild

          # --- 3. Prepare minimal source dir (ErisPulse comes from pip) ---
          mkdir -p standalone_src

          # --- 4. Build each platform ---
          # Fields: target_name  python_arch  python_os  pip_platform
          PLATFORMS="
            linux-amd64     x86_64  unknown-linux-gnu manylinux_2_17_x86_64
            linux-arm64     aarch64 unknown-linux-gnu manylinux_2_17_aarch64
            windows-amd64   x86_64  pc-windows-msvc   win_amd64
            windows-arm64   aarch64 pc-windows-msvc   win_arm64
            macos-amd64     x86_64  apple-darwin      macosx_10_9_x86_64
            macos-arm64     aarch64 apple-darwin      macosx_11_0_arm64
          "

          mkdir -p build_dist

          echo "$PLATFORMS" | while read -r target py_arch py_os pip_plat; do
            [ -z "$target" ] && continue
            echo "\n=== Building $target ==="

            # Windows needs colorama (click's conditional dep, not resolved in cross-compile)
            EXTRA_DOWNLOADS=""
            case "$target" in
              windows-*) EXTRA_DOWNLOADS='<prop name="download" value="colorama" />' ;;
            esac

            cat > "target_${target}.xml" << XML
          <build name="ErisPulse">
            <builder>
              <prop name="source" value="standalone_src" />
              <prop name="output" value="build_dist" />
              <prop name="release" value="20260610" />
              <prop name="version" value="3.12.13" />
            </builder>
            <python>
              <prop name="arch" value="x86_64" />
              <prop name="os" value="unknown-linux-gnu" />
            </python>
            <target>
              <python>
                <prop name="arch" value="${py_arch}" />
                <prop name="os" value="${py_os}" />
              </python>
              <pip>
                <prop name="platform" value="${pip_plat}" />
                <prop name="download" value="${WHEEL}" />
                <prop name="download" value="ErisPulse-Dashboard" />
                ${EXTRA_DOWNLOADS}
              </pip>
              <launcher>
                <prop name="run" value="-m ErisPulse run" />
              </launcher>
            </target>
          </build>
          XML

            # Build and immediately move output (pybuild cleans build_dist on each run)
            if ./pybuild "target_${target}.xml"; then
              mv build_dist/*.zip "release_assets/ErisPulse-${version}-${target}.zip" 2>/dev/null \
                && echo "$target" \
                || echo "⚠️ $target: no output found"
            else
              echo "⚠️ $target build failed, skipping"
            fi
          done

          echo "\n=== Build output ==="
          ls -la release_assets/App-* 2>/dev/null || echo "No standalone executables built"

      - name: Upload all assets to Release
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          tag_name="v$version"

          # release_assets/ has AI docs + App-*.zip standalone executables
          echo "All release assets:"
          ls -la release_assets/

          if [ -n "$(ls -A release_assets)" ]; then
            gh release upload "$tag_name" release_assets/* --clobber
            echo "Uploaded $(ls release_assets | wc -l) assets to $tag_name"
          else
            echo "No assets to upload"
          fi

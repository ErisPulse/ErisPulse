name: 🎀 Eris Version Management

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, Pre-Release/v2]

jobs:
  update-latest-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Create tag and release
        id: create-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        shell: bash
        run: |
          # Read current version
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          tag_name="v$version"
          fixed_version=$(echo "$version" | sed 's/-de\./-dev./g')

          echo "Current version: $version"
          echo "Tag name: $tag_name"

          # ---------------------------------------------------------------
          # Helper: extract changelog section for a version from a file
          # ---------------------------------------------------------------
          extract_changelog() {
            local file="$1"
            local ver="$2"
            local fver="$3"
            local section

            section=$(sed -n "/^## \[$ver\] -/,/^## \[.*\] -/p" "$file" | sed '$d')
            if [ -z "$section" ]; then
              section=$(sed -n "/^## \[$fver\] -/,/^## \[.*\] -/p" "$file" | sed '$d')
            fi

            if [ -n "$section" ]; then
              echo "$section" | tail -n +2
            fi
          }

          # Extract source changelog (Chinese) for current version
          source_section=$(extract_changelog "CHANGELOG.md" "$version" "$fixed_version")
          if [ -z "$source_section" ]; then
            echo "No changelog found for version $version"
            exit 0
          fi

          # Save source section to a temp file for Python to read
          echo "$source_section" > changelog_source.txt
          echo "Source changelog extracted ($(wc -c < changelog_source.txt) bytes)"

          # ---------------------------------------------------------------
          # AI-translate changelog section to target languages
          # ---------------------------------------------------------------
          # "zh-CN" is the source, no translation needed
          mkdir -p ".github/.translate_cache/release"

          python3 << 'PYEOF'
          import hashlib, json, os, sys

          targets = ["en", "zh-TW", "ja", "ru"]

          with open("changelog_source.txt", "r", encoding="utf-8") as f:
              source_text = f.read()

          # Use content hash + version as cache key
          content_hash = hashlib.md5(source_text.encode()).hexdigest()
          cache_dir = ".github/.translate_cache/release"

          results = {}
          needs_translate = []

          for lang in targets:
              cache_file = os.path.join(cache_dir, f"{content_hash}.{lang}.json")
              if os.path.exists(cache_file):
                  with open(cache_file, "r", encoding="utf-8") as f:
                      results[lang] = json.load(f)["translation"]
                  print(f"[cache hit] {lang}: {cache_file}")
              else:
                  needs_translate.append(lang)

          if needs_translate:
              # Try providers in order: SILICONFLOW -> BIGMODEL -> OPENAI
              providers = []
              if os.environ.get("SILICONFLOW_API_KEY"):
                  providers.append({
                      "api_key": os.environ["SILICONFLOW_API_KEY"],
                      "base_url": "https://api.siliconflow.cn/v1",
                      "model": "Qwen/Qwen3-Omni-30B-A3B-Captioner",
                  })
              if os.environ.get("BIGMODEL_API_KEY"):
                  providers.append({
                      "api_key": os.environ["BIGMODEL_API_KEY"],
                      "base_url": "https://open.bigmodel.cn/api/coding/paas/v4",
                      "model": "GLM-4.7-Flash",
                  })
              if os.environ.get("OPENAI_API_KEY"):
                  providers.append({
                      "api_key": os.environ["OPENAI_API_KEY"],
                      "base_url": "https://api.openai.com/v1",
                      "model": "gpt-4o-mini",
                  })

              if not providers:
                  print("WARNING: No AI API keys configured, skipping translation")
              else:
                  from openai import OpenAI

                  lang_names = {
                      "en": "English",
                      "zh-TW": "繁體中文（台灣正體）",
                      "ja": "日本語",
                      "ru": "Русский",
                  }

                  for lang in needs_translate:
                      target_name = lang_names.get(lang, lang)
                      print(f"Translating to {target_name} ({lang})...", flush=True)

                      prompt = (
                          f"You are a professional software changelog translator. "
                          f"Translate the following Chinese (zh-CN) changelog to {target_name}.\n"
                          f"Requirements:\n"
                          f"1. Keep all Markdown formatting intact (headings, lists, bold, code blocks, etc.)\n"
                          f"2. Keep code, version numbers, GitHub usernames (@xxx), and technical identifiers unchanged\n"
                          f"3. Translate only the text content and descriptions\n"
                          f"4. Use professional technical terminology appropriate for {target_name}\n"
                          f"5. Return ONLY the translated Markdown content, no extra text, no code fences\n"
                          f"\nSource (Chinese):\n\n{source_text}"
                      )

                      translated = None
                      for provider in providers:
                          try:
                              client = OpenAI(
                                  api_key=provider["api_key"],
                                  base_url=provider["base_url"],
                              )
                              resp = client.chat.completions.create(
                                  model=provider["model"],
                                  messages=[{"role": "user", "content": prompt}],
                                  temperature=0.3,
                                  max_tokens=16000,
                              )
                              translated = resp.choices[0].message.content.strip()
                              print(f"  -> Success via {provider['model']}", flush=True)
                              break
                          except Exception as e:
                              print(f"  -> {provider['model']} failed: {e}", flush=True)
                              continue

                      if translated:
                          results[lang] = translated
                          cache_file = os.path.join(cache_dir, f"{content_hash}.{lang}.json")
                          with open(cache_file, "w", encoding="utf-8") as f:
                              json.dump({"translation": translated, "source_hash": content_hash}, f, ensure_ascii=False)
                          print(f"  -> Cached to {cache_file}", flush=True)
                      else:
                          print(f"  -> FAILED to translate {lang}, will fall back to source", flush=True)

          # Store results as env vars for bash to consume
          for lang, text in results.items():
              safe_path = f"changelog_{lang}.txt"
              with open(safe_path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Saved {lang} section to {safe_path}")
          PYEOF

          # ---------------------------------------------------------------
          # Build multilingual release body
          # ---------------------------------------------------------------
          LANG_EN="English"
          LANG_ZH_CN="简体中文"
          LANG_ZH_TW="繁體中文"
          LANG_JA="日本語"
          LANG_RU="Русский"

          LANG_ORDER=("en" "zh-CN" "zh-TW" "ja" "ru")
          declare -A LANG_NAMES
          LANG_NAMES["en"]="$LANG_EN"
          LANG_NAMES["zh-CN"]="$LANG_ZH_CN"
          LANG_NAMES["zh-TW"]="$LANG_ZH_TW"
          LANG_NAMES["ja"]="$LANG_JA"
          LANG_NAMES["ru"]="$LANG_RU"

          declare -A SECTIONS
          # Source (Chinese) is always available
          SECTIONS["zh-CN"]="$source_section"
          echo "[zh-CN] using source changelog"

          # Check for translations
          TRANSLATE_TARGETS=("en" "zh-TW" "ja" "ru")
          for lang in "${TRANSLATE_TARGETS[@]}"; do
            tfile="changelog_${lang}.txt"
            if [ -f "$tfile" ] && [ -s "$tfile" ]; then
              SECTIONS["$lang"]=$(cat "$tfile")
              echo "[$lang] using AI translation"
            else
              echo "[$lang] no translation available, skipped"
            fi
          done

          # Build language switcher line
          SWITCHER_PARTS=()
          first=true
          for lang in "${LANG_ORDER[@]}"; do
            if [ -n "${SECTIONS[$lang]}" ]; then
              label="${LANG_NAMES[$lang]}"
              if [ "$first" = true ]; then
                SWITCHER_PARTS+=("**${label}**")
                first=false
              else
                SWITCHER_PARTS+=("[${label}](#${label})")
              fi
            fi
          done
          SWITCHER_LINE=$(IFS=" | "; echo "${SWITCHER_PARTS[*]}")

          # Assemble release body
          RELEASE_BODY="$SWITCHER_LINE"
          RELEASE_BODY+=$'\n\n---\n\n'

          first=true
          for lang in "${LANG_ORDER[@]}"; do
            section="${SECTIONS[$lang]}"
            if [ -z "$section" ]; then
              continue
            fi
            label="${LANG_NAMES[$lang]}"

            if [ "$first" = true ]; then
              first=false
            else
              RELEASE_BODY+=$'\n\n---\n\n'
            fi

            RELEASE_BODY+="## ${label}"
            RELEASE_BODY+=$'\n\n'
            RELEASE_BODY+="$section"
          done

          # Write body to file
          echo "$RELEASE_BODY" > release_body.md
          echo "=== Multilingual release body (first 30 lines) ==="
          head -30 release_body.md
          echo "..."
          echo "Total length: $(wc -c < release_body.md) bytes"

          # ---------------------------------------------------------------
          # Determine release type
          # ---------------------------------------------------------------
          if [[ $version =~ dev|alpha|beta|pre|a|b ]]; then
            is_dev="true"
            latest_flag=""
          else
            is_dev="false"
            latest_flag="--latest"
          fi

          # ---------------------------------------------------------------
          # Create tag and release
          # ---------------------------------------------------------------
          if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "Creating new tag $tag_name"
            git tag "$tag_name"
            git push origin "$tag_name"
          else
            echo "Tag $tag_name already exists"
          fi

          if gh release view "$tag_name" &>/dev/null; then
            echo "Updating release $tag_name"
            gh release edit "$tag_name" \
              --notes-file release_body.md \
              --prerelease=$is_dev
            echo "Release updated $tag_name"
            echo "release_updated=true" >> $GITHUB_OUTPUT
          else
            echo "Creating release $tag_name"
            gh release create "$tag_name" \
              --notes-file release_body.md \
              --title "ErisPulse $tag_name" \
              --prerelease=$is_dev \
              $latest_flag
            echo "Release created $tag_name"
            echo "release_created=true" >> $GITHUB_OUTPUT
          fi

          echo "Release page: https://github.com/${{ github.repository }}/releases/tag/$tag_name"

      - name: Generate AI material documents
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        run: |
          # Dynamically create output directories for all languages
          for lang_dir in docs/*/; do
            lang=$(basename "$lang_dir")
            if [ "$lang" != "_meta" ]; then
              mkdir -p "docs/$lang/ai-support/prompts"
            fi
          done

          if [ -f "scripts/tools/generate-ai-prompts.py" ]; then
            python scripts/tools/generate-ai-prompts.py
            echo "AI material documents generated"
          else
            echo "AI Prompt generation script not found, skipping this step"
          fi

      - name: Collect AI material documents
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        run: |
          mkdir -p release_assets

          # Dynamically scan all language directories
          PROMPT_FILES="ErisPulse-ModuleDev.md ErisPulse-AdapterDev.md ErisPulse-Full.md"
          for lang_dir in docs/*/; do
            lang=$(basename "$lang_dir")
            [ "$lang" = "_meta" ] && continue
            prompts_dir="docs/$lang/ai-support/prompts"
            [ -d "$prompts_dir" ] || continue
            for prompt_file in $PROMPT_FILES; do
              if [ -f "$prompts_dir/$prompt_file" ]; then
                base="${prompt_file%.md}"
                cp "$prompts_dir/$prompt_file" "release_assets/${base}-${lang}.md"
              fi
            done
          done

          echo "AI docs collected:"
          ls -la release_assets/ || true

      - name: Setup pybuild
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        uses: pybuild-org/pybuild@main

      - name: Build standalone executables (pybuild v2)
        id: pybuild
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        continue-on-error: true
        shell: bash
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')

          # --- 1. Build ErisPulse wheel ---
          python -m pip install --upgrade pip build
          python -m build --wheel
          WHEEL=$(ls dist/erispulse-*.whl | head -1)
          echo "Built wheel: $WHEEL"

          # --- 2. Prepare minimal source dir (ErisPulse comes from pip) ---
          mkdir -p standalone_src build_dist release_assets

          # --- 3. Generate single build config for all 6 platforms ---
          cat > target.xml << XML
          <config name="builder">
              <prop name="app" value="ErisPulse" />
              <prop name="source" value="standalone_src" />
              <prop name="output" value="build_dist" />
              <prop name="version" value="3.12.13" />
              <prop name="release" value="20260610" />
          </config>
          <run job="setup builder" />
          <config name="python">
              <prop name="arch" value="x86_64" />
              <prop name="os" value="unknown-linux-gnu" />
          </config>
          <run job="setup python" />
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="x86_64" />
                  <prop name="os" value="unknown-linux-gnu" />
              </config>
              <config name="pip">
                  <prop name="platform" value="manylinux_2_17_x86_64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="aarch64" />
                  <prop name="os" value="unknown-linux-gnu" />
              </config>
              <config name="pip">
                  <prop name="platform" value="manylinux_2_17_aarch64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="x86_64" />
                  <prop name="os" value="pc-windows-msvc" />
              </config>
              <config name="pip">
                  <prop name="platform" value="win_amd64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
                  <prop name="download" value="colorama" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="aarch64" />
                  <prop name="os" value="pc-windows-msvc" />
              </config>
              <config name="pip">
                  <prop name="platform" value="win_arm64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
                  <prop name="download" value="colorama" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="x86_64" />
                  <prop name="os" value="apple-darwin" />
              </config>
              <config name="pip">
                  <prop name="platform" value="macosx_10_9_x86_64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <config type="group" name="standalone targets">
              <config name="python">
                  <prop name="arch" value="aarch64" />
                  <prop name="os" value="apple-darwin" />
              </config>
              <config name="pip">
                  <prop name="platform" value="macosx_11_0_arm64" />
                  <prop name="download" value="${WHEEL}" />
                  <prop name="download" value="ErisPulse-Dashboard" />
              </config>
              <config name="launcher">
                  <prop name="run" value="-m ErisPulse run" />
              </config>
          </config>
          <run job="build standalone" />
          XML

          # --- 4. Build all platforms in one pass ---
          if ! pybuild target.xml; then
            echo "⚠️ pybuild encountered errors, collecting any partial outputs"
          fi

          # --- 5. Rename outputs to release naming convention ---
          # pybuild v2 names outputs as {python.arch}-{python.os}.zip
          declare -A TARGET_MAP=(
            ["x86_64-unknown-linux-gnu"]="linux-amd64"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["x86_64-pc-windows-msvc"]="windows-amd64"
            ["aarch64-pc-windows-msvc"]="windows-arm64"
            ["x86_64-apple-darwin"]="macos-amd64"
            ["aarch64-apple-darwin"]="macos-arm64"
          )

          for zip in build_dist/*.zip; do
            [ -f "$zip" ] || continue
            base=$(basename "$zip" .zip)
            target="${TARGET_MAP[$base]:-}"
            if [ -n "$target" ]; then
              mv "$zip" "release_assets/ErisPulse-${version}-${target}.zip"
              echo "Built: ErisPulse-${version}-${target}.zip"
            else
              echo "⚠️ Unknown output: $base"
            fi
          done

          echo "\n=== Build output ==="
          ls -la release_assets/ErisPulse-*.zip 2>/dev/null || echo "No standalone executables built"

      - name: Upload all assets to Release
        if: steps.create-release.outputs.release_created == 'true' || steps.create-release.outputs.release_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          tag_name="v$version"

          # release_assets/ has AI docs + ErisPulse-*.zip standalone executables
          echo "All release assets:"
          ls -la release_assets/

          if [ -n "$(ls -A release_assets)" ]; then
            gh release upload "$tag_name" release_assets/* --clobber
            echo "Uploaded $(ls release_assets | wc -l) assets to $tag_name"
          else
            echo "No assets to upload"
          fi

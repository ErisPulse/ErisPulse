name: 🧪 Eris Test Check

permissions:
  contents: read
  pull-requests: write

# 同一 PR 反复推送时取消旧的进行中运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        id: ruff-check
        run: |
          echo "Running Ruff code check..."
          ruff_output=$(uv run ruff check src/ tests/ 2>&1; echo "RUFF_EXIT_CODE=$?")
          exit_code=${ruff_output##*RUFF_EXIT_CODE=}
          ruff_output=${ruff_output%RUFF_EXIT_CODE=*}

          echo "RUFF_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$ruff_output" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ "$exit_code" -ne 0 ]; then
            echo "has_ruff_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_ruff_issues=false" >> $GITHUB_OUTPUT
          fi

          # 正式门禁：发现问题即失败（评论仍会发出，见下一步）
          exit $exit_code

      - name: Post Ruff check results to PR
        if: always() && steps.ruff-check.outputs.has_ruff_issues == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              comment.body.includes('Ruff Code Check')
            );

            const message = `## Ruff Code Check Results

            > 🚫 Blocking check: merge is blocked until the issues below are fixed

            \`\`\`
            ${process.env.RUFF_OUTPUT}
            \`\`\`
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

  pytest-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --extra test

      - name: Run tests
        id: pytest-check
        run: |
          echo "Running Pytest tests..."
          pytest_output=$(uv run pytest tests/unit -p no:cacheprovider -n auto -v --tb=short --cov-report=term-missing 2>&1; echo "PYTEST_EXIT_CODE=$?")
          exit_code=${pytest_output##*PYTEST_EXIT_CODE=}
          pytest_output=${pytest_output%PYTEST_EXIT_CODE=*}
          echo "$pytest_output"

          # Truncate to last 300 lines to avoid env var size limits
          line_count=$(echo "$pytest_output" | wc -l)
          if [ "$line_count" -gt 300 ]; then
            pytest_output=$(echo "$pytest_output" | tail -n 300)
            echo "Output truncated to last 300 lines (total: $line_count)"
          fi

          echo "PYTEST_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$pytest_output" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ "$exit_code" -ne 0 ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

          if [ "$exit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Post test success to PR
        if: always() && steps.pytest-check.outputs.has_errors != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              (comment.body.includes('Test Results') || comment.body.includes('Test Passed'))
            );

            const message = `## Test Passed

            All tests completed successfully.
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

      - name: Post test results to PR
        if: always() && steps.pytest-check.outputs.has_errors == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              (comment.body.includes('Test Results') || comment.body.includes('Test Passed'))
            );

            const output = process.env.PYTEST_OUTPUT || '';
            const lines = output.split('\n');
            const MAX_LINES = 50;
            const truncated = lines.length > MAX_LINES;
            const displayLines = truncated ? lines.slice(-MAX_LINES) : lines;
            const displayOutput = displayLines.join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let message;
            if (truncated) {
              message = `## Tests failed — merge blocked

            > Output truncated to last ${MAX_LINES} lines (total: ${lines.length} lines)
            > [View full output in Actions](${runUrl})

            \`\`\`
            ... (top ${lines.length - MAX_LINES} lines omitted)
            ${displayOutput}
            \`\`\`
            `;
            } else {
              message = `## Tests failed — merge blocked

            \`\`\`
            ${displayOutput}
            \`\`\`
            `;
            }

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

  integration-check:
    # 集成测试（真实组件，非 mock）此前只在本地运行；单机单版本常态跑，
    # 失败阻塞合并
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --extra test

      - name: Run integration tests
        run: uv run pytest tests/integration -p no:cacheprovider -n auto --tb=short -q --no-cov

  # free-threaded-smoke:
  #   # Experimental Python 3.14t (free-threaded / no-GIL) smoke: monitoring signal only,
  #   # NOT a supported platform. Skips gracefully when the ecosystem lacks cp314t wheels.
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 5
  #   continue-on-error: true
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v7
  #       with:
  #         enable-cache: true

  #     - name: Smoke test on Python 3.14t (free-threaded)
  #       run: |
  #         uv python install 3.14t
  #         if uv run --python 3.14t --isolated python -c "import ErisPulse" 2>uv_314t_err.log; then
  #           echo "3.14t import smoke passed; running unit tests..."
  #           # --isolated 环境只装运行依赖，不装任何依赖组/extras，测试依赖须经 --extra test 显式带入
  #           uv run --python 3.14t --isolated --extra test pytest tests/unit -p no:cacheprovider -q --no-cov
  #         else
  #           echo "::warning::Python 3.14t smoke skipped: cp314t dependency wheels unavailable"
  #           cat uv_314t_err.log || true
  #           exit 0
  #         fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # 全量 extras：存储后端驱动（aiomysql/asyncpg）为惰性可选导入，
        # 缺装时 basedpyright 会对 Core/storage/* 误报 reportMissingImports
        run: uv sync --all-extras

      - name: Run basedpyright type check
        # 正式门禁：src/ErisPulse 基线 0 error（Any/Unknown 豁免由
        # pyproject 配置管理），新增错误必须清零
        run: uv run basedpyright src/ErisPulse

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pip-audit on locked dependencies
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict

  i18n-consistency:
    # 五语言翻译键一致性（AGENTS 规则 12）：新增键未同步任一语言即失败
    name: i18n Locale Keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check locale key parity
        run: python scripts/tools/check_i18n_locales.py

  docs-links:
    # 文档内部相对链接检查（AGENTS 规则 16：删除/移动 zh-CN 文档防死链）；
    # 自动生成目录（ai-support / api-reference/auto_api）由脚本内部排除
    name: Docs Internal Links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check docs internal links
        run: python scripts/tools/check_docs_links.py

  storage-backends:
    # MySQL / PostgreSQL 双后端真机验证（存储引擎 + ORM 方言路径）。
    # 对应发布门禁：tests/devs/test_storage_backend_verify.py 与
    # orm_realmachine_verify.py 此前仅手动执行，本 job 使其随每个 PR 持续验证。
    # 若服务容器出现不稳定，可将本 job 降级为 workflow_dispatch 手动触发。
    name: Storage Backends (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, postgres]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erispulse
          MYSQL_USER: erispulse
          MYSQL_PASSWORD: erispulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erispulse
          POSTGRES_USER: erispulse
          POSTGRES_PASSWORD: erispulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erispulse -d erispulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ERISPULSE_STORAGE_MYSQL_HOST: 127.0.0.1
      ERISPULSE_STORAGE_MYSQL_PORT: "3306"
      ERISPULSE_STORAGE_MYSQL_USER: erispulse
      ERISPULSE_STORAGE_MYSQL_PASSWORD: erispulse
      ERISPULSE_STORAGE_MYSQL_DATABASE: erispulse
      ERISPULSE_STORAGE_POSTGRES_HOST: 127.0.0.1
      ERISPULSE_STORAGE_POSTGRES_PORT: "5432"
      ERISPULSE_STORAGE_POSTGRES_USER: erispulse
      ERISPULSE_STORAGE_POSTGRES_PASSWORD: erispulse
      ERISPULSE_STORAGE_POSTGRES_DATABASE: erispulse
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies (with backend drivers)
        run: uv sync --extra test --extra mysql --extra postgres

      - name: Verify storage backend capabilities
        run: |
          set -e
          uv run python tests/devs/test_storage_backend_verify.py --backend ${{ matrix.backend }}
          uv run python tests/devs/orm_realmachine_verify.py --backend ${{ matrix.backend }}

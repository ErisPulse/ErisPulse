name: 🧪 Eris Test Check

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  workflow_dispatch:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        continue-on-error: true
        run: |
          echo "Running Ruff code check..."
          ruff_output=$(ruff check src/ tests/ 2>&1; echo "RUFF_EXIT_CODE=$?")
          exit_code=${ruff_output##*RUFF_EXIT_CODE=}
          ruff_output=${ruff_output%RUFF_EXIT_CODE=*}

          echo "RUFF_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$ruff_output" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ "$exit_code" -ne 0 ]; then
            echo "has_ruff_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_ruff_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Ruff check results to PR
        if: steps.ruff-check.outputs.has_ruff_issues == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              comment.body.includes('Ruff Code Check')
            );

            const message = `## Ruff Code Check Results

            > ⚠️ This check does not block merging, for reference only

            \`\`\`
            ${process.env.RUFF_OUTPUT}
            \`\`\`
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

  pytest-check:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        id: pytest-check
        run: |
          echo "Running Pytest tests..."
          pytest_output=$(pytest tests/unit -v --tb=short --cov-report=term-missing 2>&1; echo "PYTEST_EXIT_CODE=$?")
          exit_code=${pytest_output##*PYTEST_EXIT_CODE=}
          pytest_output=${pytest_output%PYTEST_EXIT_CODE=*}
          echo "$pytest_output"

          # Truncate to last 300 lines to avoid env var size limits
          line_count=$(echo "$pytest_output" | wc -l)
          if [ "$line_count" -gt 300 ]; then
            pytest_output=$(echo "$pytest_output" | tail -n 300)
            echo "Output truncated to last 300 lines (total: $line_count)"
          fi

          echo "PYTEST_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$pytest_output" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ "$exit_code" -ne 0 ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

          if [ "$exit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Post test success to PR
        if: always() && steps.pytest-check.outputs.has_errors != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              (comment.body.includes('Test Results') || comment.body.includes('Test Passed'))
            );

            const message = `## Test Passed

            All tests completed successfully.
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

      - name: Post test results to PR
        if: always() && steps.pytest-check.outputs.has_errors == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const botName = '${{ steps.app-token.outputs.app-slug }}[bot]';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(comment =>
              comment.user.login === botName &&
              (comment.body.includes('Test Results') || comment.body.includes('Test Passed'))
            );

            const output = process.env.PYTEST_OUTPUT || '';
            const lines = output.split('\n');
            const MAX_LINES = 50;
            const truncated = lines.length > MAX_LINES;
            const displayLines = truncated ? lines.slice(-MAX_LINES) : lines;
            const displayOutput = displayLines.join('\n');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let message;
            if (truncated) {
              message = `## Tests failed — merge blocked

            > Output truncated to last ${MAX_LINES} lines (total: ${lines.length} lines)
            > [View full output in Actions](${runUrl})

            \`\`\`
            ... (top ${lines.length - MAX_LINES} lines omitted)
            ${displayOutput}
            \`\`\`
            `;
            } else {
              message = `## Tests failed — merge blocked

            \`\`\`
            ${displayOutput}
            \`\`\`
            `;
            }

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            }

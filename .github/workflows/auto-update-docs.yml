name: "📚 Eris Docs Update"

permissions:
  contents: write

# Prevent push during translation from re-triggering the same workflow, cancel duplicate runs
concurrency:
  group: docs-update
  cancel-in-progress: true

on:
  push:
    branches: [Develop/v2]
    # 注：翻译产物已 artifact 化（不再提交进仓库），workflow 自身不会产生
    # docs 提交，因此无需 paths-ignore 防递归——纯文档推送也会触发翻译
  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force re-translate all documents'
        required: false
        default: 'false'

jobs:
  update-and-generate-docs:
    runs-on: ubuntu-latest
    # 硬上限：5h（GitHub 允许的 job 上限内），为翻译预算外的生成/检查/收尾留 30 分钟
    timeout-minutes: 300
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Get bot user ID
        id: bot-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          echo "bot-user-id=$BOT_USER_ID" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不让 checkout 缓存初始 token 到 .git/config（http.extraheader）。
          # 原因：GitHub App installation token 有效期硬编码为 1h，长任务（>1h）
          # 中缓存的初始 token 会先过期，且 extraheader 优先级高于 URL 中嵌入的
          # 认证，导致后续 refresh 的 token 无法生效。所有写操作统一由后续步骤
          # 通过 git remote set-url 注入最新 token（每次提交前各 refresh 一次）。
          persist-credentials: false

      - name: Setup environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Check cache directory status
        run: |
          echo "=== Checking cache directory ==="
          echo "Current working directory: $(pwd)"
          echo "Cache directory exists: $(test -d .github/.translate_cache && echo 'YES' || echo 'NO')"
          if [ -d ".github/.translate_cache" ]; then
            echo "Cache file count: $(find .github/.translate_cache -name '*.cache' 2>/dev/null | wc -l)"
            echo "Cache directory contents:"
            ls -la .github/.translate_cache/ | head -10
            echo ""
            echo "Sample cache files:"
            ls -la .github/.translate_cache/*.cache 2>/dev/null | head -3
          fi
          echo "==================="


      - name: Pre-clean broken translation caches
        continue-on-error: true
        run: |
          # 检测上一轮产物中的截断/乱码等错误并删除其缓存，
          # 使本轮翻译自动重译这些文件（否则坏译文会因源 hash 未变被一直复用）
          python scripts/tools/check-translation.py --fix || true

      - name: Auto-translate docs (time-budgeted rounds)
        id: translate-docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEBUG_TRANSLATE: "1"
        run: |
          echo "Starting document translation..."

          # Check if force translation is needed
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_translate }}" == "true" ]; then
            FORCE_FLAG="--force"
            echo "Force re-translation mode enabled"
          fi

          if [ ! -f "scripts/tools/translate-docs.py" ]; then
            echo "Translation script not found, skipping this step"
            echo "docs_updated=false" >> $GITHUB_OUTPUT
            echo "translate_failed=false" >> $GITHUB_OUTPUT
            echo "remaining=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not configured, skipping translation step"
            echo "Translation requires OPENAI_API_KEY to be configured in repository Secrets"
            echo "docs_updated=false" >> $GITHUB_OUTPUT
            echo "translate_failed=false" >> $GITHUB_OUTPUT
            echo "remaining=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 翻译总预算（分钟）：job 硬上限 300 分钟（5h），翻译占 270 分钟（4.5h），
          # 为生成/检查/收尾留 30 分钟余量。脚本到点优雅退出（缓存落盘），
          # 下一轮从缓存续译；轮次用于异常退出后的快速恢复。
          TOTAL_BUDGET_MINUTES=270
          MAX_ROUNDS=3
          ROUND=0
          FINAL_REMAINING=0
          TRANSLATE_EXIT_CODE=0
          START_TIME=$SECONDS

          while [ $ROUND -lt $MAX_ROUNDS ]; do
            ROUND=$((ROUND + 1))
            ELAPSED_MIN=$(( (SECONDS - START_TIME) / 60 ))
            LEFT_MIN=$(( TOTAL_BUDGET_MINUTES - ELAPSED_MIN ))

            if [ $ROUND -gt 1 ] && [ $LEFT_MIN -lt 5 ]; then
              echo "剩余时间不足 5 分钟，停止续译"
              break
            fi

            echo "=== Translation round ${ROUND}/${MAX_ROUNDS} (budget: ${LEFT_MIN} min) ==="
            OUTPUT_FILE=$(mktemp)
            set +e
            python scripts/tools/translate-docs.py $FORCE_FLAG --time-budget $LEFT_MIN 2>&1 | tee "$OUTPUT_FILE"
            TRANSLATE_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            # 读取脚本输出的机器可读统计行（REMAINING_FILES=N）
            FINAL_REMAINING=$(grep -oE 'REMAINING_FILES=[0-9]+' "$OUTPUT_FILE" | tail -1 | cut -d= -f2)
            [ -z "$FINAL_REMAINING" ] && FINAL_REMAINING=0
            rm -f "$OUTPUT_FILE"

            # 首轮之后不再强制重译（缓存续传）
            FORCE_FLAG=""
            echo "Round ${ROUND} finished, remaining translations: ${FINAL_REMAINING}"

            if [ $TRANSLATE_EXIT_CODE -ne 0 ]; then
              echo "⚠️ Translation script exited with code ${TRANSLATE_EXIT_CODE}"
            fi

            if [ "$FINAL_REMAINING" -eq 0 ]; then
              break
            fi
          done

          # Check if translated docs were updated (including root README.*.md files)
          if git diff --quiet -- docs/ README.md README.*.md 2>/dev/null; then
            echo "No changes in translated docs"
            echo "docs_updated=false" >> $GITHUB_OUTPUT
          else
            echo "Translated docs changes detected"
            echo "docs_updated=true" >> $GITHUB_OUTPUT
          fi

          echo "remaining=$FINAL_REMAINING" >> $GITHUB_OUTPUT

          # Record translation failure status (but don't interrupt the workflow)
          if [ $TRANSLATE_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Some files failed to translate, but successfully translated files will be committed"
            echo "translate_failed=true" >> $GITHUB_OUTPUT
          else
            echo "translate_failed=false" >> $GITHUB_OUTPUT
          fi

          if [ "$FINAL_REMAINING" -gt 0 ]; then
            echo "::warning::仍有 ${FINAL_REMAINING} 个翻译任务因时间预算耗尽未完成，下次文档更新触发时将自动续译"
          fi

      # ==================== 翻译质量防线 ====================
      # 提交前确定性检查（提示词泄露/围栏损坏/截断/乱码）：
      # --fix 会删除问题文件的翻译缓存，下次文档更新触发时自动重译自愈；
      # 检出问题不阻塞工作流（正常文件照常提交），但留下错误标记供人工跟进
      - name: Check translation quality (pre-commit gate)
        id: check-translation
        continue-on-error: true
        run: |
          python scripts/tools/check-translation.py --fix

      # ==================== 生成类文档（API / AI Prompt / 索引，基于本轮最新翻译） ====================
      # ai-prompts / docs-index 扫描各语言 docs 内容生成，必须在翻译之后运行；
      # 否则产物基于上一轮旧翻译，且 docs/** 变更不会再触发本 workflow（滞后无法自愈）。
      # api-docs 从源码 docstring 生成（与翻译无关），保持在 docs-index 之前（其 auto_api 索引依赖该产物）。

      - name: Update API docs (multilingual)
        id: update-api
        run: |
          echo "Starting API docs update..."

          # Run API docs update script (auto-generates for all languages)
          if [ -f "scripts/tools/generate-api-docs.py" ]; then
            python scripts/tools/generate-api-docs.py
            echo "API docs update complete"
          else
            echo "API docs update script not found, skipping this step"
          fi

          # Check if API docs were updated
          if git diff --quiet docs/*/api-reference/; then
            echo "No changes in API docs"
            echo "api_updated=false" >> $GITHUB_OUTPUT
          else
            echo "API docs changes detected"
            echo "api_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate AI Prompt docs (multilingual)
        id: generate-ai-prompts
        run: |
          echo "Starting AI Prompt document generation..."

          # Run AI prompt generation script (auto-generates for all languages)
          if [ -f "scripts/tools/generate-ai-prompts.py" ]; then
            python scripts/tools/generate-ai-prompts.py
            echo "AI Prompt document generation complete"
          else
            echo "AI Prompt generation script not found, skipping this step"
          fi

          # Check if AI Prompt docs were updated
          if git diff --quiet docs/*/ai-support/prompts/; then
            echo "No changes in AI Prompt docs"
            echo "ai_prompts_updated=false" >> $GITHUB_OUTPUT
          else
            echo "AI Prompt docs changes detected"
            echo "ai_prompts_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate docs index (multilingual)
        id: generate-docs-index
        run: |
          echo "Starting docs index generation..."

          # Run docs index generation script (auto-generates for all languages)
          if [ -f "scripts/tools/generate-docs-index.py" ]; then
            python scripts/tools/generate-docs-index.py
            echo "Docs index generation complete"
          else
            echo "Docs index generation script not found, skipping this step"
          fi

          # Check if docs index was updated
          if git diff --quiet docs/_meta/; then
            echo "No changes in docs index"
            echo "docs_index_updated=false" >> $GITHUB_OUTPUT
          else
            echo "Docs index changes detected"
            echo "docs_index_updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload translated docs as artifact
        if: steps.translate-docs.outputs.docs_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: translated-docs
          path: |
            docs/
            README.md
            README.*.md
          retention-days: 400
          if-no-files-found: ignore

      - name: Upload generated docs as artifact
        if: steps.update-api.outputs.api_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: docs/
          retention-days: 400
          if-no-files-found: ignore

      - name: Publish docs tree to docs-generated branch (durable)
        if: steps.update-api.outputs.api_updated == 'true' || steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 多语言文档树的持久层：单提交强推到 orphan 分支（分支永久，artifact 会过期）。
          # GITHUB_TOKEN 推送不触发 workflow，天然防递归。
          rm -rf /tmp/docs-pub && mkdir -p /tmp/docs-pub
          cp -r docs /tmp/docs-pub/docs
          cd /tmp/docs-pub
          git init -q -b docs-generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "docs build ${{ github.sha }} $(date -u '+%Y-%m-%dT%H:%MZ')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin docs-generated:docs-generated

      - name: Summarize updates
        if: always()
        run: |
          echo "Summarizing document updates..."
          echo "Generated docs produced in this run (uploaded as artifacts, not committed):"
          echo "  - API reference docs: ${{ steps.update-api.outputs.api_updated }}"
          echo "  - AI Prompt docs: ${{ steps.generate-ai-prompts.outputs.ai_prompts_updated }}"
          echo "  - Docs index: ${{ steps.generate-docs-index.outputs.docs_index_updated }}"
          echo "  - Translated docs produced: ${{ steps.translate-docs.outputs.docs_updated }}"
          echo "  - Remaining translations (time budget): ${{ steps.translate-docs.outputs.remaining }}"
          echo "  - Translation script failure: ${{ steps.translate-docs.outputs.translate_failed }}"

      - name: Docs update complete
        if: steps.update-api.outputs.api_updated == 'true' || steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        run: |
          echo "Document update complete"
          echo "All documents have been updated and uploaded as build artifacts (not committed to the repository)"
          echo "Includes:"
          if [ "${{ steps.update-api.outputs.api_updated }}" == "true" ]; then
            echo "  - API reference docs (multilingual)"
          fi
          if [ "${{ steps.generate-ai-prompts.outputs.ai_prompts_updated }}" == "true" ]; then
            echo "  - AI Prompt docs (multilingual)"
          fi
          if [ "${{ steps.generate-docs-index.outputs.docs_index_updated }}" == "true" ]; then
            echo "  - Docs index (multilingual)"
          fi
          if [ "${{ steps.translate-docs.outputs.docs_updated }}" == "true" ]; then
            echo "  - Translated docs"
            echo "  - Translation cache"
          fi
          if [ "${{ steps.translate-docs.outputs.translate_failed }}" == "true" ]; then
            echo "  ⚠️ Note: Some files failed to translate, you can retry later"
          fi
          if [ -n "${{ steps.translate-docs.outputs.remaining }}" ] && [ "${{ steps.translate-docs.outputs.remaining }}" != "0" ]; then
            echo "  ⏳ Note: ${{ steps.translate-docs.outputs.remaining }} translations deferred (time budget), next docs push will resume them"
          fi
          echo "Document work complete"

      - name: No updates notice
        if: steps.update-api.outputs.api_updated != 'true' && steps.translate-docs.outputs.docs_updated != 'true' && steps.generate-ai-prompts.outputs.ai_prompts_updated != 'true' && steps.generate-docs-index.outputs.docs_index_updated != 'true'
        run: |
          echo "No document updates found today"
          echo "All documents are up to date"
          echo "Will continue monitoring the document repository"
          echo "See you next update"

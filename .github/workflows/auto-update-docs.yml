name: "📚 Eris Docs Update"

permissions:
  contents: write

concurrency:
  group: docs-update
  cancel-in-progress: true

on:
  push:
    branches: [Develop/v2]
    # 注：翻译产物已 artifact 化（不再提交进仓库），workflow 自身不会产生
    # docs 提交，因此无需 paths-ignore 防递归——纯文档推送也会触发翻译
  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force re-translate all documents'
        required: false
        default: 'false'

jobs:
  update-and-generate-docs:
    runs-on: ubuntu-latest
    # 硬上限：5h（GitHub 允许的 job 上限内），为翻译预算外的生成/检查/收尾留 30 分钟
    timeout-minutes: 300
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Get bot user ID
        id: bot-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          echo "bot-user-id=$BOT_USER_ID" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不让 checkout 缓存初始 token 到 .git/config（http.extraheader）。
          # 原因：GitHub App installation token 有效期硬编码为 1h，长任务（>1h）
          # 中缓存的初始 token 会先过期，且 extraheader 优先级高于 URL 中嵌入的
          # 认证，导致后续 refresh 的 token 无法生效。所有写操作统一由后续步骤
          # 通过 git remote set-url 注入最新 token（每次提交前各 refresh 一次）。
          persist-credentials: false

      - name: Setup environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Restore docs from artifact
        id: restore-cache
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: .
        continue-on-error: true

      - name: Check cache status
        run: |
          echo "Cache directory status:"
          test -d .github/.translate_cache && echo "Cache exists" || echo "No cache"
          if [ -d ".github/.translate_cache" ]; then
            echo "Cache file count: $(find .github/.translate_cache -name '*.cache' 2>/dev/null | wc -l)"
          fi

      - name: Pre-clean broken translation caches
        continue-on-error: true
        run: |
          # 检测上一轮产物中的截断/乱码等错误并删除其缓存，
          # 使本轮翻译自动重译这些文件（否则坏译文会因源 hash 未变被一直复用）
          python -m scripts.tools check translation --fix || true

      - name: Translate docs
        id: translate-docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEBUG_TRANSLATE: "1"
        run: |
          echo "Starting translation..."

          FORCE_FLAG=""
          [ "${{ github.event.inputs.force_translate }}" == "true" ] && FORCE_FLAG="--force"

          [ ! -f "scripts/tools/translate.py" ] && { echo "Script not found"; echo "docs_updated=false" >> $GITHUB_OUTPUT; echo "translate_failed=false" >> $GITHUB_OUTPUT; echo "remaining=0" >> $GITHUB_OUTPUT; exit 0; }
          [ -z "$OPENAI_API_KEY" ] && { echo "API key missing"; echo "docs_updated=false" >> $GITHUB_OUTPUT; echo "translate_failed=false" >> $GITHUB_OUTPUT; echo "remaining=0" >> $GITHUB_OUTPUT; exit 0; }

          TOTAL_BUDGET_MINUTES=270
          MAX_ROUNDS=3
          ROUND=0
          FINAL_REMAINING=0
          TRANSLATE_EXIT_CODE=0
          START_TIME=$SECONDS

          while [ $ROUND -lt $MAX_ROUNDS ]; do
            ROUND=$((ROUND + 1))
            ELAPSED_MIN=$(( (SECONDS - START_TIME) / 60 ))
            LEFT_MIN=$(( TOTAL_BUDGET_MINUTES - ELAPSED_MIN ))

            [ $ROUND -gt 1 ] && [ $LEFT_MIN -lt 5 ] && break

            echo "Round ${ROUND}/${MAX_ROUNDS} (budget: ${LEFT_MIN} min)"
            OUTPUT_FILE=$(mktemp)
            set +e
            python -m scripts.tools translate $FORCE_FLAG --time-budget $LEFT_MIN 2>&1 | tee "$OUTPUT_FILE"
            TRANSLATE_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            FINAL_REMAINING=$(grep -oE 'REMAINING_FILES=[0-9]+' "$OUTPUT_FILE" | tail -1 | cut -d= -f2)
            [ -z "$FINAL_REMAINING" ] && FINAL_REMAINING=0
            rm -f "$OUTPUT_FILE"

            FORCE_FLAG=""
            echo "Round ${ROUND} finished, remaining: ${FINAL_REMAINING}"

            [ $TRANSLATE_EXIT_CODE -ne 0 ] && echo "Warning: Exit code ${TRANSLATE_EXIT_CODE}"
            [ "$FINAL_REMAINING" -eq 0 ] && break
          done

          git diff --quiet -- docs/ README.md README.*.md 2>/dev/null && { echo "No changes"; echo "docs_updated=false" >> $GITHUB_OUTPUT; } || { echo "Changes detected"; echo "docs_updated=true" >> $GITHUB_OUTPUT; }

          echo "remaining=$FINAL_REMAINING" >> $GITHUB_OUTPUT

          [ $TRANSLATE_EXIT_CODE -ne 0 ] && echo "translate_failed=true" >> $GITHUB_OUTPUT || echo "translate_failed=false" >> $GITHUB_OUTPUT
          [ "$FINAL_REMAINING" -gt 0 ] && echo "::warning::Remaining: ${FINAL_REMAINING}"

      - name: Check translation quality
        id: check-translation
        continue-on-error: true
        run: |
          python -m scripts.tools check translation --fix

      - name: Update API docs
        id: update-api
        run: |
          echo "Updating API docs..."
          [ -f "scripts/tools/generators/spec.py" ] && python -m scripts.tools gen api-docs
          git diff --quiet docs/*/api-reference/ && echo "api_updated=false" >> $GITHUB_OUTPUT || echo "api_updated=true" >> $GITHUB_OUTPUT

      - name: Generate AI Prompt docs
        id: generate-ai-prompts
        run: |
          echo "Generating AI Prompt docs..."
          [ -f "scripts/tools/generators/spec.py" ] && python -m scripts.tools gen ai-prompts
          git diff --quiet docs/*/ai-support/prompts/ && echo "ai_prompts_updated=false" >> $GITHUB_OUTPUT || echo "ai_prompts_updated=true" >> $GITHUB_OUTPUT

      - name: Generate docs index
        id: generate-docs-index
        run: |
          echo "Generating docs index..."
          [ -f "scripts/tools/generators/spec.py" ] && python -m scripts.tools gen docs-index
          git diff --quiet docs/_meta/ && echo "docs_index_updated=false" >> $GITHUB_OUTPUT || echo "docs_index_updated=true" >> $GITHUB_OUTPUT

      - name: Upload all docs as artifact
        if: steps.translate-docs.outputs.docs_updated == 'true' || steps.update-api.outputs.api_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: |
            docs/
            README.md
            README.*.md
            .github/.translate_cache/
          retention-days: 400
          if-no-files-found: ignore

      - name: Publish docs tree to docs-generated branch (durable)
        if: steps.update-api.outputs.api_updated == 'true' || steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 多语言文档树的持久层：单提交强推到 orphan 分支（分支永久，artifact 会过期）。
          # GITHUB_TOKEN 推送不触发 workflow，天然防递归。
          rm -rf /tmp/docs-pub && mkdir -p /tmp/docs-pub
          cp -r docs /tmp/docs-pub/docs
          cd /tmp/docs-pub
          git init -q -b docs-generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "docs build ${{ github.sha }} $(date -u '+%Y-%m-%dT%H:%MZ')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin docs-generated:docs-generated

      - name: Summarize updates
        if: always()
        run: |
          echo "Summarizing document updates..."
          echo "Generated docs produced in this run (uploaded as artifacts, not committed):"
          echo "  - API reference docs: ${{ steps.update-api.outputs.api_updated }}"
          echo "  - AI Prompt docs: ${{ steps.generate-ai-prompts.outputs.ai_prompts_updated }}"
          echo "  - Docs index: ${{ steps.generate-docs-index.outputs.docs_index_updated }}"
          echo "  - Translated docs produced: ${{ steps.translate-docs.outputs.docs_updated }}"
          echo "  - Remaining translations (time budget): ${{ steps.translate-docs.outputs.remaining }}"
          echo "  - Translation script failure: ${{ steps.translate-docs.outputs.translate_failed }}"

      - name: Docs update complete
        if: steps.update-api.outputs.api_updated == 'true' || steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-ai-prompts.outputs.ai_prompts_updated == 'true' || steps.generate-docs-index.outputs.docs_index_updated == 'true'
        run: |
          echo "Document update complete"
          echo "All documents have been updated and uploaded as build artifacts (not committed to the repository)"
          echo "Includes:"
          if [ "${{ steps.update-api.outputs.api_updated }}" == "true" ]; then
            echo "  - API reference docs (multilingual)"
          fi
          if [ "${{ steps.generate-ai-prompts.outputs.ai_prompts_updated }}" == "true" ]; then
            echo "  - AI Prompt docs (multilingual)"
          fi
          if [ "${{ steps.generate-docs-index.outputs.docs_index_updated }}" == "true" ]; then
            echo "  - Docs index (multilingual)"
          fi
          if [ "${{ steps.translate-docs.outputs.docs_updated }}" == "true" ]; then
            echo "  - Translated docs"
            echo "  - Translation cache"
          fi
          if [ "${{ steps.translate-docs.outputs.translate_failed }}" == "true" ]; then
            echo "  ⚠️ Note: Some files failed to translate, you can retry later"
          fi
          if [ -n "${{ steps.translate-docs.outputs.remaining }}" ] && [ "${{ steps.translate-docs.outputs.remaining }}" != "0" ]; then
            echo "  ⏳ Note: ${{ steps.translate-docs.outputs.remaining }} translations deferred (time budget), next docs push will resume them"
          fi
          echo "Document work complete"

      - name: No updates notice
        if: steps.update-api.outputs.api_updated != 'true' && steps.translate-docs.outputs.docs_updated != 'true' && steps.generate-ai-prompts.outputs.ai_prompts_updated != 'true' && steps.generate-docs-index.outputs.docs_index_updated != 'true'
        run: |
          echo "No document updates found today"
          echo "All documents are up to date"
          echo "Will continue monitoring the document repository"
          echo "See you next update"

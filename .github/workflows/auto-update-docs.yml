name: "📚 Eris Docs Update"

# 文档产物管线：翻译（zh-CN → 各语言）+ 生成器产物；文档树与翻译缓存提交回
# 开发分支，AI 物料（prompts / skills.zip）只发布到 docs-generated orphan 分支
# （单提交强推，官网与 raw 直链的分发源）；另存 workflow artifact 查验副本
#
# 设计要点：
# - 文档与翻译缓存随开发分支入库：checkout 即含最新状态，跨轮缓存天然续传
# - 翻译尽力而为：部分失败不阻断提交（已成功译文照常入库，失败文件下轮续译）
# - 产物副本（artifact / docs-generated）先于分支提交落盘：任一写步骤失败时产物已在手
# - App Installation Token 有效期 1h < 翻译预算 270min：App Token 在翻译完成后才铸造
# - 触发面收窄：仅文档/源码 docstring/生成器/译者变更触发（纯测试与构建配置不触发）
# - 非抢占锁：push 排队不打断进行中的翻译；手动触发可勾选 cancel_running 取消旧任务重跑
# - bash 安全纪律：任何步骤脚本不得以可能短路的 `cmd && cmd` 语句结尾
#   （短路退出码会成为整个步骤的退出码——历史事故根因）

permissions:
  contents: write

concurrency:
  group: docs-update
  # 非抢占锁：翻译预算 270min，push 触发的新任务排队等待，不打断进行中的翻译。
  # 仅在手动触发并勾选 cancel_running 时取消旧任务立即重跑。
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.cancel_running == 'true' }}

on:
  push:
    branches: [Develop/v2]
    # 只在会影响文档产物的路径变更时触发：源文档、根 README、
    # docstring（api-docs / ai-prompts 输入）、生成器与译者、分发用 README
    paths:
      - 'docs/zh-CN/**'
      - 'README.md'
      - 'README.*.md'
      - 'src/ErisPulse/**'
      - 'scripts/tools/**'
      - '.github/dist-readme/README*.md'
      - '.github/workflows/auto-update-docs.yml'
  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force re-translate all documents'
        required: false
        default: 'false'
      cancel_running:
        description: 'Cancel the in-progress docs run and start fresh'
        required: false
        default: 'false'

jobs:
  update-and-generate-docs:
    runs-on: ubuntu-latest
    # 硬上限 5h：翻译预算 270min + 生成/检查/收尾余量
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          # 默认 GITHUB_TOKEN 只读检出（公共仓库）；写操作由发布/提交步骤
          # 经 remote set-url 注入翻译完成后新铸造的 App Token
          persist-credentials: false

      # 排队 run 的触发 commit 早于前一轮产物提交：checkout 检出的是旧快照，
      # 译文与 .translate_cache 均过期会触发全量重译。同步到分支最新 HEAD，
      # 让本轮命中上一轮缓存、只译增量。
      - name: Sync to latest branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          echo "Synced to $(git rev-parse --short HEAD) (${{ github.ref_name }})"
          exit 0

      - name: Setup environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Cache status
        run: |
          if [ -d ".github/.translate_cache" ]; then
            echo "Translate cache: $(find .github/.translate_cache -name '*.cache' 2>/dev/null | wc -l) files"
          else
            echo "Translate cache: none (cold start)"
          fi
          exit 0

      # 检测上一轮产物中的截断/乱码并删除其缓存，使本轮自动重译
      # （auto-translate 每轮的步骤 1 也会做；此处是循环外的首轮预清理）
      - name: Pre-clean broken translation caches
        continue-on-error: true
        run: python -m scripts.tools check translation --fix

      # ----------------------------------------------------------------------
      # 翻译：auto-translate 单命令（检测→清缓存→翻译→验证 循环，Python 内调度）
      # 尽力而为语义——退出码恒 0，失败/剩余经 TRANSLATE_FAILED / REMAINING_FILES
      # 标记传递（产出照常入库，问题文件下一轮自动重译）
      # ----------------------------------------------------------------------
      - name: Translate docs
        id: translate-docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEBUG_TRANSLATE: "1"
        run: |
          echo "Starting translation..."

          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.force_translate }}" == "true" ]; then
            EXTRA_FLAGS="--force-first"
          fi

          OUTPUT_FILE=$(mktemp)
          set +e
          python -m scripts.tools auto-translate --max-rounds 3 --time-budget 270 $EXTRA_FLAGS 2>&1 | tee "$OUTPUT_FILE"
          set -e

          SAW_FAILURE=$(grep -oE 'TRANSLATE_FAILED=[01]' "$OUTPUT_FILE" | tail -1 | cut -d= -f2)
          if [ -z "$SAW_FAILURE" ]; then
            SAW_FAILURE=0
          fi
          FINAL_REMAINING=$(grep -oE 'REMAINING_FILES=[0-9]+' "$OUTPUT_FILE" | tail -1 | cut -d= -f2)
          if [ -z "$FINAL_REMAINING" ]; then
            FINAL_REMAINING=0
          fi
          rm -f "$OUTPUT_FILE"

          if git diff --quiet -- docs/ README.md README.*.md 2>/dev/null; then
            echo "docs_updated=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in translations"
            echo "docs_updated=true" >> $GITHUB_OUTPUT
          fi

          echo "remaining=$FINAL_REMAINING" >> $GITHUB_OUTPUT
          if [ "$SAW_FAILURE" = "1" ]; then
            echo "translate_failed=true" >> $GITHUB_OUTPUT
          else
            echo "translate_failed=false" >> $GITHUB_OUTPUT
          fi
          if [ "$FINAL_REMAINING" -gt 0 ]; then
            echo "::warning::Remaining translations (time budget): ${FINAL_REMAINING}"
          fi
          exit 0

      # ----------------------------------------------------------------------
      # 生成器：api-docs / ai-prompts / skills / docs-index 统一产出
      # ----------------------------------------------------------------------
      - name: Generate docs artifacts
        id: generate-docs
        run: |
          updated_any=false

          check_updated() {
            local label="$1"
            shift
            if git diff --quiet "$@"; then
              echo "${label}=false" >> $GITHUB_OUTPUT
            else
              echo "${label}=true" >> $GITHUB_OUTPUT
              updated_any=true
              echo "Updated: ${label}"
            fi
          }

          python -m scripts.tools gen api-docs
          check_updated api_updated -- docs/*/api-reference/

          python -m scripts.tools gen ai-prompts
          check_updated ai_prompts_updated -- docs/*/ai-support/prompts/

          python -m scripts.tools gen skills
          check_updated skills_updated -- docs/*/ai-support/skills.zip

          python -m scripts.tools gen docs-index
          check_updated docs_index_updated -- docs/_meta/

          if [ "$updated_any" = true ]; then
            echo "any_updated=true" >> $GITHUB_OUTPUT
          else
            echo "any_updated=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      # ----------------------------------------------------------------------
      # 查验副本（先于提交落盘）：artifact（400 天）+ docs-generated orphan
      # 分支（单提交强推）。提交回开发分支放在最后——任一写步骤失败时
      # 产物副本已在手（App Installation Token 有效期 1h，翻译预算 270min，
      # 故在本步才铸造，避免长任务后 token 失效）
      # ----------------------------------------------------------------------
      - name: Upload all docs as artifact
        if: always() && (steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-docs.outputs.any_updated == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: |
            docs/
            README.md
            README.*.md
            .github/.translate_cache/
          retention-days: 400
          if-no-files-found: ignore
          # v4 默认剔除点开头路径——翻译缓存目录（.github/.translate_cache）
          # 必须显式包含，否则跨轮缓存续传断裂（每轮全量重译）
          include-hidden-files: true

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ERISBOT_APP_ID }}
          private-key: ${{ secrets.ERISBOT_PRIVATE_KEY }}

      - name: Publish docs tree to docs-generated branch (durable)
        if: always() && (steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-docs.outputs.any_updated == 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # 分发层：文档树 + AI 物料 + skills.zip，单提交强推 orphan 分支（分支永久，artifact 会过期）。
          BOT_SLUG="${{ steps.app-token.outputs.app-slug }}"
          BOT_USER_ID=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          rm -rf /tmp/docs-pub && mkdir -p /tmp/docs-pub
          cp -r docs /tmp/docs-pub/docs
          cp .github/dist-readme/README*.md /tmp/docs-pub/
          cd /tmp/docs-pub
          git init -q -b docs-generated
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "docs build ${{ github.sha }} $(date -u '+%Y-%m-%dT%H:%MZ')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin docs-generated:docs-generated

      # ----------------------------------------------------------------------
      # 产物提交回开发分支：克隆/pull 即得最新多语言文档；
      # fetch+rebase 处理翻译期间远端新提交（产物路径与源码基本不冲突），
      # rebase 失败不判 job 失败（产物已先落 artifact + docs-generated）
      # ----------------------------------------------------------------------
      - name: Commit docs to branch
        id: commit-docs
        if: steps.translate-docs.outputs.docs_updated == 'true' || steps.generate-docs.outputs.any_updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BOT_SLUG="${{ steps.app-token.outputs.app-slug }}"
          BOT_USER_ID=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${BOT_SLUG}[bot]@users.noreply.github.com"

          git add docs/ README.md README.*.md .github/.translate_cache/
          # ai-support 物料已 gitignore：只发布到 docs-generated，不回提开发分支
          git commit -qm "docs: 自动更新文档产物 (${{ github.sha }}) [skip ci]"

          # persist-credentials: false，写凭据在此显式注入（token 为上一步新铸造）
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 远端在翻译期间可能有新提交：rebase 后推送
          if git fetch origin "${{ github.ref_name }}" && git rebase "origin/${{ github.ref_name }}"; then
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "committed=true" >> $GITHUB_OUTPUT
              echo "已提交回 ${{ github.ref_name }}: $(git rev-parse --short HEAD)"
              exit 0
            fi
          fi
          echo "::warning::提交回分支失败（远端推进/rebase 冲突），产物经 artifact 与 docs-generated 兜底"
          echo "committed=false" >> $GITHUB_OUTPUT
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "=== Docs pipeline summary ==="
          echo "Translations updated : ${{ steps.translate-docs.outputs.docs_updated }}"
          echo "  - remaining (budget): ${{ steps.translate-docs.outputs.remaining }}"
          echo "  - script failures  : ${{ steps.translate-docs.outputs.translate_failed }}"
          echo "API reference        : ${{ steps.generate-docs.outputs.api_updated }}"
          echo "AI prompts           : ${{ steps.generate-docs.outputs.ai_prompts_updated }}"
          echo "Skills               : ${{ steps.generate-docs.outputs.skills_updated }}"
          echo "Docs index           : ${{ steps.generate-docs.outputs.docs_index_updated }}"
          echo "Committed to branch  : ${{ steps.commit-docs.outputs.committed }}"
          exit 0

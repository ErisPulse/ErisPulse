name: 🐳 Docker Hub Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Pre-Release/*
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# 同一 ref 的连续 push 取消旧的进行中运行，避免并发推同标签
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: erispulse/erispulse

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release channel
        id: channel
        run: |
          REF="${{ github.ref }}"
          # 与 auto-tag-release 的预发布判定同口径；非正式发布一律只推 dev 标签
          if [[ "$REF" == refs/tags/v* ]] && ! grep -qE '(dev|alpha|beta|rc|pre)' <<< "$REF"; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/erispulse
          tags: |
            # 正式版：latest + 完整版本号 + 主次版本号
            type=semver,pattern={{version}},enable=${{ steps.channel.outputs.stable == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channel.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.channel.outputs.stable == 'true' }}
            # 非正式发布（预发布 tag / 分支 push）只推 dev 标签
            type=raw,value=dev,enable=${{ steps.channel.outputs.stable != 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # tag 触发时按标签 pin PyPI 版本：此前从不传 build-args，镜像内装的
          # 可能是 PyPI 上的"最新版"而非本 tag 对应版本（标签与内容不一致）
          build-args: |
            ERISPULSE_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo ""
          echo "███████╗██████╗ ███████╗██████╗ ██╗  ██╗"
          echo "██╔════╝██╔══██╗██╔════╝██╔══██╗██║ ██╔╝"
          echo "█████╗  ██████╔╝███████╗██║  ██║█████╔╝"
          echo "██╔══╝  ██╔═══╝ ╚════██║██║  ██║██╔═██╗"
          echo "███████╗██║     ███████║██████╔╝██║  ██╗"
          echo "╚══════╝╚═╝     ╚══════╝╚═════╝ ╚═╝  ╚═╝"
          echo "  Docker image published successfully"
          echo ""
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Registry: Docker Hub + GitHub Container Registry"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "  - ${tag}"
          done
          echo "Platforms: linux/amd64,linux/arm64"

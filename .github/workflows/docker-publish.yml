name: 🐳 Docker Hub Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pin ErisPulse version from PyPI (e.g. 2.12.0); empty = dev image from PyPI latest"
        required: false
        default: ""
  push:
    branches:
      - main
      - Pre-Release/*
  workflow_run:
    # PyPI Publish 成功结束后才构建镜像：旧模式 tag 与 PyPI 上传并发，build-arg
    # pin 的版本尚未收录，pip 解析直接失败。workflow_run 事件运行在默认分支
    # 上下文，head_branch 携带触发 run 的 tag 名（如 v2.12.0），据其 pin 版本。
    workflows: ["🎀 Eris PyPI Publish"]
    types: [completed]

permissions:
  contents: read
  packages: write

# 同一 ref 的连续 push 取消旧的进行中运行，避免并发推同标签
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: erispulse/erispulse

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    # workflow_run 只在 PyPI Publish 成功时接手；push/dispatch 维持原语义
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release channel
        id: channel
        run: |
          # 频道判定（预发布口径与 auto-tag-release 一致：dev/alpha/beta/rc/pre）
          # ① workflow_run（PyPI Publish 成功后）：head_branch 为 v* tag → pin
          #    该版本（正式 → latest + x.y.z + x.y；预发布 → dev）
          # ② workflow_dispatch 带 version 输入 → pin 手动指定版本（正式发布
          #    补发 / 重发入口）
          # ③ push main / Pre-Release → dev 镜像，装 PyPI 最新版
          version=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            head="${{ github.event.workflow_run.head_branch }}"
            if [[ "$head" == v* ]]; then version="${head#v}"; fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          fi

          img_dh="docker.io/${{ env.IMAGE_NAME }}"
          img_ghcr="ghcr.io/${{ github.repository_owner }}/erispulse"

          if [[ -n "$version" ]]; then
            if grep -qE '(dev|alpha|beta|rc|pre)' <<< "$version"; then
              tags="${img_dh}:dev
          ${img_ghcr}:dev"
            else
              tags="${img_dh}:latest
          ${img_dh}:${version}
          ${img_dh}:${version%.*}
          ${img_ghcr}:latest
          ${img_ghcr}:${version}
          ${img_ghcr}:${version%.*}"
            fi
          else
            tags="${img_dh}:dev
          ${img_ghcr}:dev"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.channel.outputs.tags }}
          # pin 的版本此时必然已在 PyPI 收录（本 run 由 publish 成功触发）；
          # dev 镜像（push main）不传版本，装 PyPI 最新版
          build-args: |
            ERISPULSE_VERSION=${{ steps.channel.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo ""
          echo "███████╗██████╗ ███████╗██████╗ ██╗  ██╗"
          echo "██╔════╝██╔══██╗██╔════╝██╔══██╗██║ ██╔╝"
          echo "█████╗  ██████╔╝███████╗██║  ██║█████╔╝"
          echo "██╔══╝  ██╔═══╝ ╚════██║██║  ██║██╔═██╗"
          echo "███████╗██║     ███████║██████╔╝██║  ██╗"
          echo "╚══════╝╚═╝     ╚══════╝╚═════╝ ╚═╝  ╚═╝"
          echo "  Docker image published successfully"
          echo ""
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Registry: Docker Hub + GitHub Container Registry"
          echo "Tags:"
          echo "${{ steps.channel.outputs.tags }}" | while IFS= read -r tag; do
            echo "  - ${tag}"
          done
          echo "Platforms: linux/amd64,linux/arm64"

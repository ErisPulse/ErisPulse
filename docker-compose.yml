# ErisPulse Docker Compose
#
# Usage:
#   docker compose up -d
#
#
# China Mirror (if Docker Hub is inaccessible):
#   Replace the image with:
#     image: ghcr.io/erispulse/erispulse:latest
#
# Environment variables:
#   ERISPULSE_PORT              - Dashboard 端口 (默认: 8000)
#   ERISPULSE_DASHBOARD_TOKEN   - Dashboard 登录令牌
#   LANG                        - 系统语言，自动检测启动界面语言 (默认: en_US.UTF-8)
#   ERISPULSE_LANG              - 强制启动界面语言: zh, zh_TW, en, ja, ru (覆盖 LANG)
#   TZ                          - 时区 (默认: Asia/Shanghai)
#
# Docs: https://github.com/ErisPulse/ErisPulse

services:
  erispulse:
    build:
      context: .
      target: ${ERISPULSE_BUILD_TARGET:-production}
    image: erispulse/erispulse:${ERISPULSE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-erispulse}
    ports:
      - "${ERISPULSE_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config
      - ./config/.packages:/usr/local/lib/python3.13/site-packages
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - LANG=${LANG:-en_US.UTF-8}
      - ERISPULSE_LANG=${ERISPULSE_LANG:-}
      - ERISPULSE_DASHBOARD_TOKEN=${ERISPULSE_DASHBOARD_TOKEN:-}
    command: ["epsdk", "run"]
    restart: on-failure:5
    # 防止 OOM 导致重启（根据实际情况调整）
    # mem_limit: 512m
    # mem_reservation: 256m
